{% extends "base.html" %}
{% block title %}Meus Pedidos{% endblock %}

{% block content %}

<h2 class="area-title">
  Meus Pedidos
</h2>

<div class="order-table-wrap">

  <table class="order-table">

    <thead>
      <tr>
        <th>ID</th>
        <th>Status</th>
        <th>Data</th>
        <th>Ação</th>
      </tr>
    </thead>

    <tbody id="orders-body">
      {% for o in orders %}
      <tr id="order-row-{{ o.id }}" class="order-row">

        <td class="prod-name">
          <strong>#{{ o.id }}</strong>
        </td>

        <td class="center">
          <!-- 🔥 CORREÇÃO AQUI -->
          <span class="status-badge {{ o.status }}">
              {{ o.get_status_display }}
          </span>
        </td>

        <td class="center">
          {{ o.created_at|date:"d/m/Y H:i" }}
        </td>

        <td class="center">
          <a href="{% url 'q_order_detail' o.id %}" class="btn-mini btn-mini-sm">
            Abrir
          </a>
        </td>

      </tr>
      {% empty %}
      <tr>
        <td colspan="4" style="text-align:center;">
          Nenhum pedido encontrado.
        </td>
      </tr>
      {% endfor %}
    </tbody>

  </table>

</div>

<script>
const protocol = window.location.protocol === "https:" ? "wss://" : "ws://";

const socket = new WebSocket(
    protocol + window.location.host + "/ws/orders/"
);

socket.onmessage = function(e) {
    const data = JSON.parse(e.data);

    const orderRow = document.getElementById("order-row-" + data.order_id);

    if (orderRow) {

        const badge = orderRow.querySelector(".status-badge");

        if (badge) {

            // 🔥 texto
            badge.innerText = data.status_display.toUpperCase();

            // 🔥 remove todas classes
            badge.className = "status-badge";

            // 🔥 aplica classe correta (AGORA COMPATÍVEL COM CSS)
            badge.classList.add(data.status);
        }

        if (data.status === "RECEIVED") {
            orderRow.style.transition = "0.3s";
            orderRow.style.opacity = "0";
            setTimeout(() => orderRow.remove(), 300);
        }
    }
};
</script>

{% endblock %}
