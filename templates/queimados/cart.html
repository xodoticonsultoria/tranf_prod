{% extends "base.html" %}
{% load static %}
{% block title %}Carrinho{% endblock %}
{% block content %}

<form style="display:none;">
  {% csrf_token %}
</form>

<h2 class="area-title">
  CARRINHO DE PEDIDOS
</h2>

{% if items %}
<div class="x-grid">

  {% for item in items %}
  <div class="x-prod">

    <div class="x-prod-name">
      {{ item.product.name|upper }}
    </div>

    <div class="x-qty">
      <button type="button" onclick="dec(this)">−</button>

      <input
        type="number"
        value="{{ item.qty_requested }}"
        min="0"
        onchange="updateItem(this, {{ item.id }})"
      >

      <button type="button" onclick="inc(this)">+</button>
    </div>

    <button
      type="button"
      class="x-save"
      onclick="removeItem(this, {{ item.id }})"
    >
      REMOVER
    </button>

  </div>
  {% endfor %}

</div>

<div style="margin-top:20px;">
  <a href="{% url 'q_submit_order' %}" class="x-save">
    ENVIAR PEDIDO
  </a>
</div>

{% else %}
<p>Carrinho vazio.</p>
{% endif %}

<script>

// mesmas funções do products
function inc(btn){
  const input = btn.parentElement.querySelector("input")
  input.value = parseInt(input.value || 1) + 1
}

function dec(btn){
  const input = btn.parentElement.querySelector("input")
  const v = parseInt(input.value || 1)
  if(v > 1) input.value = v - 1
}

</script>

{% endblock %}
